<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ROBOV | 登录</title><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./home.css"><link rel="stylesheet" href="./login.css"></head>
<body class="home-page"><div class="app-shell"><header class="topbar"><a class="brand" href="./"><span class="brand-mark">R</span>ROBOV.ai</a><nav class="home-nav" aria-label="ROBOV"><a href="./merchants.html">商家</a><a href="./academy.html">Academy</a></nav></header>
<main class="login-shell"><p class="eyebrow">ROBOV / ACCOUNT</p><div class="login-modes" role="tablist" aria-label="登录类型"><button id="member-mode" type="button" role="tab" aria-selected="true" data-mode="member">会员登录</button><button id="employee-mode" type="button" role="tab" aria-selected="false" data-mode="employee">商家登录</button></div>
<form id="login-form"><h1 id="login-title">会员登录</h1><div id="signup-name" hidden><label for="login-name">姓名</label><input id="login-name" autocomplete="name" maxlength="100"></div><label for="login-identifier" id="identifier-label">邮箱</label><input id="login-identifier" type="email" autocomplete="username" required maxlength="254"><label for="login-password">密码</label><input id="login-password" type="password" autocomplete="current-password" required minlength="8" maxlength="128"><button class="primary-button" id="login-submit" type="submit">登录</button><p id="login-status" role="status" aria-live="polite"></p><button id="signup-toggle" class="text-button" type="button">注册会员</button></form>
</main></div><script src="./tab-session.js"></script><script src="./locale-data.js"></script><script src="./i18n.js"></script><script src="./login.js"></script></body></html>
